name: Build bundle
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: bundle-main
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C bundle config user.name 'github-actions[bot]'
          git -C bundle config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Build and push bundle
        id: bundle
        run: |
          before="$(git rev-parse HEAD)"
          node scripts/build-bundle.mjs --push
          if [ "$before" != "$(git rev-parse HEAD)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # Source branches have no workflow file; push events there cannot run this workflow.
      # GITHUB_TOKEN pushes do not trigger another push workflow, so dispatch explicitly.
      - name: Dispatch image workflow
        if: steps.bundle.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --ref main
